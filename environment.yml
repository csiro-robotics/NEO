name: neo
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ffmpeg
  - git
  - ninja
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - -e ./submodules/nerfstudio
      - -e ./submodules/lerf_bbox
      - -e ./submodules/neo_lerftogo
      - -e .[language]
