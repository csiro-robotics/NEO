[project]
name = "neo"
description = "Repository contining Neo method for Nerfstudio."
version = "0.0.1"

dependencies=[
    "scipy",
    "tqdm",
    "nerfstudio>=1.0.0",
    "transformers",
    "diffusers",
    "accelerate",
    "segment_anything @ git+https://github.com/facebookresearch/segment-anything.git"
]

[tool.setuptools.packages.find]
include = ["neo*"]

[project.entry-points.'nerfstudio.method_configs']
neo = 'neo.neo_config:neo_method'
sparse_guided_nerf = 'neo.neo_config:sparse_guided_nerf_method'
replace_nerf = 'neo.neo_config:replace_nerf_method'

[project.scripts]
ns-convert = "neo.scripts.convert_to_neo:entrypoint"
ns-eval-neo = "neo.eval.eval:entrypoint"
ns-render-neo = "neo.render.render:entrypoint"